name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pytest (SQLite — USE_POSTGRES não definido)
        env:
          SECRET_KEY: ci-test-key
          DEBUG: 'True'
        run: pytest -v

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cobertura de pageHelp (scripts/check-help.js)
        working-directory: .
        run: node scripts/check-help.js

      - name: Paridade RequireRole.jsx ↔ Layout.jsx (scripts/check-access-parity.js)
        working-directory: .
        run: node scripts/check-access-parity.js
