<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Documento Weber-e{% endblock %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 11pt; color: #1a1a1a; background: #fff; line-height: 1.5; }
  .page { max-width: 210mm; margin: 0 auto; padding: 20mm 25mm; }
  /* Cabeçalho */
  .header { border-bottom: 3px solid #1351B4; padding-bottom: 12px; margin-bottom: 24px; }
  .header-org { font-size: 9pt; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .header-tipo { font-size: 18pt; font-weight: bold; color: #1351B4; margin-bottom: 4px; }
  .header-ref  { font-size: 10pt; color: #555; }
  /* Seções */
  .section-title {
    font-size: 9pt; font-weight: bold; color: #fff;
    background: #1351B4; padding: 5px 10px;
    margin-top: 20px; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  /* Campos */
  .field { margin-bottom: 10px; }
  .field-label { font-size: 8pt; font-weight: bold; color: #666; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .field-value { font-size: 10.5pt; color: #1a1a1a; }
  /* Grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  /* Tabela */
  table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-top: 6px; }
  th { background: #1351B4; color: #fff; font-weight: bold; padding: 6px 8px; text-align: left; }
  td { padding: 5px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  tr:nth-child(even) td { background: #EBF1FF; }
  /* Badges de status */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 8pt; font-weight: bold; }
  .badge-green   { background:#D1FAE5; color:#065F46; }
  .badge-blue    { background:#DBEAFE; color:#1E40AF; }
  .badge-yellow  { background:#FEF3C7; color:#92400E; }
  .badge-orange  { background:#FFEDD5; color:#9A3412; }
  .badge-red     { background:#FEE2E2; color:#991B1B; }
  .badge-gray    { background:#F3F4F6; color:#374151; }
  .badge-purple  { background:#EDE9FE; color:#5B21B6; }
  /* Assinaturas */
  .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 40px; border-top: 1px solid #ccc; padding-top: 20px; }
  .sig-block { text-align: center; }
  .sig-line { border-top: 1px solid #333; margin: 50px 10% 6px; }
  .sig-name { font-weight: bold; font-size: 10pt; }
  .sig-role { font-size: 8.5pt; color: #555; }
  /* Rodapé */
  .footer { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 8px; font-size: 7.5pt; color: #888; text-align: center; }
  .warning { background: #FFF3CD; border: 1px solid #FBBF24; padding: 8px 12px; font-size: 9pt; color: #78350F; margin: 12px 0; text-align: center; }
  /* Print */
  @media print {
    body { font-size: 10pt; }
    .page { padding: 15mm 20mm; max-width: none; }
    .section-title { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr:nth-child(even) td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="page">
  {% block content %}{% endblock %}
  <div class="footer">
    Sistema Weber-e — Documento gerado eletronicamente em {% now "d/m/Y H:i" %} |
    Este documento requer assinatura física ou digital (GOV.BR / SEI) para ter validade jurídica.
  </div>
</div>
</body>
</html>
