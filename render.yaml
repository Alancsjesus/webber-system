# Blueprint do Render.com — sobe banco + backend + frontend com um único "Apply".
# Doc: https://render.com/docs/blueprint-spec
# Uso: New → Blueprint no painel do Render, apontar para este repositório.

databases:
  - name: webber-db
    databaseName: webber_db
    user: webber_user
    plan: free
    region: oregon

services:
  # ── Backend Django (Docker, usa o Dockerfile/entrypoint.prod.sh já existentes) ──
  - type: web
    name: webber-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    # Sem healthCheckPath — /api/ exige autenticação (401), o que fazia o Render
    # achar o serviço "não saudável" e reiniciar em loop. Sem essa chave, o Render
    # só confirma que a porta está respondendo, o que já é suficiente aqui.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_POSTGRES
        value: "True"
      - key: DB_NAME
        fromDatabase:
          name: webber-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: webber-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: webber-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: webber-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: webber-db
          property: port
      # "*" — ambiente de teste; o Render também expõe subdomínio dinâmico e
      # referenciar o próprio serviço via fromService não resolveu de forma
      # confiável no ALLOWED_HOSTS.
      - key: ALLOWED_HOSTS
        value: "*"
      # Domínio fixo em vez de fromService: a property "host" do Render devolve
      # só o nome curto do serviço (ex: "webber-backend"), não o hostname público
      # completo (".onrender.com") -- causava DisallowedHost/URL quebrada.
      - key: CORS_ALLOWED_ORIGIN_HOST
        value: webber-frontend.onrender.com
      # hCaptcha — bypass mantido ligado propositalmente enquanto esta instância for
      # ambiente de teste (decisão do usuário, 26/08/2026). Antes de expor a instância
      # além de testes internos, trocar para "False" e configurar:
      # 1. Criar um site em dashboard.hcaptcha.com/sites/new (plano gratuito, sem
      #    custo) apontando para o domínio do frontend.
      # 2. Colar a "Secret Key" aqui no painel do Render (Environment do serviço
      #    webber-backend) — "sync: false" evita que o valor fique no git.
      # 3. Colar a "Site Key" em HCAPTCHA_SITE_KEY no serviço webber-frontend abaixo
      #    (rebuild necessário — é injetada em tempo de build pelo Vite).
      - key: HCAPTCHA_BYPASS
        value: "True"
      - key: HCAPTCHA_SECRET
        sync: false

  # ── Frontend React (build estático, sem servidor próprio) ──────────────────────
  - type: web
    name: webber-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Domínio fixo — ver comentário equivalente no CORS_ALLOWED_ORIGIN_HOST acima.
      - key: VITE_API_HOST
        value: webber-backend.onrender.com
      # Site Key real do hCaptcha (ver comentário em webber-backend/HCAPTCHA_SECRET
      # acima) — sem valor aqui, o frontend cai no site key de teste público do
      # hCaptcha, que sempre aprova e não bloqueia nada.
      - key: VITE_HCAPTCHA_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
